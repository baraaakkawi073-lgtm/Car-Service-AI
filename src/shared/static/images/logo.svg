<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="g2" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="g3" x1="8" y1="10" x2="40" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>

  <!-- ===== ICON: Hexagonal AI Core ===== -->
  <!-- Outer hex -->
  <path d="M24 2 L44 13 L44 35 L24 46 L4 35 L4 13 Z" fill="url(#g2)" stroke="url(#g1)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Inner hex accent -->
  <path d="M24 8 L38 16 L38 32 L24 40 L10 32 L10 16 Z" fill="none" stroke="rgba(0,229,255,0.12)" stroke-width="0.6"/>

  <!-- Car silhouette inside hex -->
  <g stroke="url(#g3)" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18.5 14 Q20 11 24 10 Q28 11 29.5 14"/>
    <line x1="18.5" y1="14" x2="16" y2="20"/>
    <line x1="29.5" y1="14" x2="32" y2="20"/>
    <path d="M13 22 L16 20 L32 20 L35 22"/>
    <line x1="13" y1="22" x2="12" y2="32"/>
    <line x1="35" y1="22" x2="36" y2="32"/>
    <line x1="12" y1="32" x2="15" y2="33"/>
    <line x1="36" y1="32" x2="33" y2="33"/>
    <line x1="15" y1="33" x2="33" y2="33"/>
    <circle cx="14" cy="23" r="2" stroke-width="1" stroke="rgba(0,229,255,0.7)"/>
    <circle cx="34" cy="23" r="2" stroke-width="1" stroke="rgba(0,229,255,0.7)"/>
    <circle cx="14" cy="23" r="0.8" fill="rgba(0,229,255,0.5)"/>
    <circle cx="34" cy="23" r="0.8" fill="rgba(0,229,255,0.5)"/>
    <line x1="21" y1="22" x2="21" y2="27" stroke-width="0.6" stroke="rgba(0,229,255,0.25)"/>
    <line x1="24" y1="22" x2="24" y2="27" stroke-width="0.6" stroke="rgba(0,229,255,0.25)"/>
    <line x1="27" y1="22" x2="27" y2="27" stroke-width="0.6" stroke="rgba(0,229,255,0.25)"/>
  </g>

  <!-- AI scan line -->
  <line x1="6" y1="22" x2="42" y2="22" stroke="url(#g1)" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.4"/>

  <!-- Diagnostic nodes -->
  <circle cx="24" cy="10" r="1.5" fill="#00e5ff" opacity="0.8"/>
  <circle cx="12" cy="32" r="1.2" fill="#3b82f6" opacity="0.7"/>
  <circle cx="36" cy="32" r="1.2" fill="#3b82f6" opacity="0.7"/>

  <!-- ===== WORDMARK ===== -->
  <text x="56" y="27" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.10em" fill="white">CAR SERVICE</text>
  <text x="56" y="46" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.10em" fill="url(#g1)">AI</text>

  <!-- Tagline -->
  <text x="96" y="46" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="6" font-weight="500" letter-spacing="0.18em" fill="rgba(0,229,255,0.45)">POWERED DIAGNOSTICS</text>
</svg>